<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <!-- device-width：手机/平板浏览器认这个 meta，写死 1920 会让布局视口变 1920、
       页面按 1:1 显示只露左边一截（body overflow:hidden 连滚都滚不动）。
       给 device-width 后 innerWidth 才是真实屏宽，fitScale 才能把画布整块缩放铺进去。
       桌面浏览器（副屏 kiosk）本来就忽略此 meta，改动对副屏零影响。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- iOS「添加到主屏幕」后全屏运行、隐藏 Safari 工具栏；状态栏黑色融进 HUD 深底。
       非 iOS 浏览器忽略这两行。注：局域网走 http 非安全上下文，Wake Lock 用不了，
       iPad 需在「设置 → 显示与亮度 → 自动锁定」选“永不”。 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Claude Code HUD</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body>
  <div class="hud" id="hud">
    <div class="grid"></div>
    <div class="cnr c1"></div><div class="cnr c2"></div>
    <div class="cnr c3"></div><div class="cnr c4"></div>

    <div class="pnl banner" id="banner"></div>

    <div class="cols">
      <div class="pnl col-tl">
        <div class="lbl" id="tl-header">活动时间线 · LIVE</div>
        <div class="tl mono" id="timeline"></div>
      </div>
      <div class="pnl col-mid">
        <div id="tasks"></div>
        <div id="toolcounts"></div>
        <div id="changes"></div>
      </div>
      <div class="pnl col-usage" id="usage"></div>
    </div>

    <div class="pnl footer mono" id="footer"></div>
  </div>
  <div class="alert" id="alert"></div>
  <script type="module" src="hud.js"></script>
</body>
</html>
